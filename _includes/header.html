{%- assign nav_pages = "About,/about/|Backgrounds,/backgrounds/|Publications,/publications/|Projects,/projects/|Contact,/contact/" | split: "|" -%}
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__sigil">$</span>
      <span class="brand__name">Joohyun Lee</span>
      <span class="brand__role">— Research Engineer</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active"{% endif %}>Home</a>
      {%- for item in nav_pages -%}
        {%- assign parts = item | split: "," -%}
        <a href="{{ parts[1] | relative_url }}"{% if page.url contains parts[1] %} class="is-active"{% endif %}>{{ parts[0] }}</a>
      {%- endfor -%}
      <a href="{{ '/blog/' | relative_url }}" class="nav-btn{% if page.url contains '/blog' or page.layout == 'post' %} is-active{% endif %}">Blog</a>
    </nav>
  </div>
</header>
