<header class="site-header custom-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/backgrounds/' | relative_url }}">Backgrounds</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/contact/' | relative_url }}" class="contact-link">Contact</a>
    </nav>
    <div class="palette-switcher" aria-hidden="false">
      <button class="palette-swatch" data-palette="aurora" aria-label="Aurora palette">
        <span class="swatch" style="background:linear-gradient(135deg,#c9c2ff,#bfe8ff);"></span>
      </button>
      <button class="palette-swatch" data-palette="sunrise" aria-label="Sunrise palette">
        <span class="swatch" style="background:linear-gradient(135deg,#ffb98b,#fff2a8);"></span>
      </button>
      <button class="palette-swatch" data-palette="festival" aria-label="Festival palette">
        <span class="swatch" style="background:linear-gradient(135deg,#ff7ab6,#7af0ff);"></span>
      </button>
    </div>
  </div>
</header>
