# Site settings
title: Joohyun Lee
description: >-
  Portfolio of Joohyun Lee — Research Engineer in autonomous driving and an OMSCS student
  at Georgia Tech. Point cloud registration & reconstruction, 3D vision, multi-object
  tracking, and robotics. Publications, projects, and notes.
url: "https://curiousLionH.github.io"
baseurl: ""

# Author
author:
  name: Lee, Joohyun
  email: "joohyun@gatech.edu"

# Social card / SEO
image: /assets/img/profile_pic.jpg

# Theme
theme: minima
minima:
  skin: dark

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# MathJax
math: true

# Collections & defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/profile_pic.jpg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Lee, Joohyun"
      toc: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .bundle/
  - .omc/
  - README.md
  - portfolio/
  - profile_pic.JPG

# Categories for this blog
# paper-review: 논문 리뷰
# tech: 기술 포스트
# note: 공부 노트
