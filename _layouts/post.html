---
layout: default
---
<div class="layout layout--single">
  <main class="main">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">all posts</a>
    <article>
      <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
          <span>{{ page.date | date: "%Y.%m.%d" }}</span>
          {%- if page.categories.size > 0 %}<span>{{ page.categories | join: " / " }}</span>{% endif -%}
          {%- for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor -%}
        </div>
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>
</div>
